- ENTRY:
  EXPLAIN: |
    ワークショップ(Hello): 12.API Gateway 追加
  BODY: |
    ■ API Gateway 追加

    • API Gateway を使用して、Lambda 関数を HTTP エンドポイントとして公開
    • API のルートにマウントされた Lambda プロキシ統合を使用
      • 任意の URL パスへのリクエストが直接 Lambda 関数にプロキシされてレスポンス返却

    ■ スタックに LambdaRestApi コンストラクト追加

    • lib/cdk-workshop-stack.ts に API エンドポイントを定義、Lambda 関数と関連付け

    import { Stack, StackProps } from "aws-cdk-lib";
    import { Code, Function, Runtime } from "aws-cdk-lib/aws-lambda";
    import { Construct } from "constructs";
    import { LambdaRestApi } from "aws-cdk-lib/aws-apigateway";   // <---- API Gateway インポート

    export class CdkWorkshopStack extends Stack {
      constructor(scope: Construct, id: string, props?: StackProps) {
        super(scope, id, props);

        const hello = new Function(this, "HelloHandler", {
          runtime: Runtime.NODEJS_22_X,
          code: Code.fromAsset("lambda"),
          handler: "hello.handler",
        });

        // 「hello」関数を基盤としたAPI Gateway REST APIリソースを定義
        const gateway = new LambdaRestApi(this, "Endpoint", {
          handler: hello,
        });
      }
    }

