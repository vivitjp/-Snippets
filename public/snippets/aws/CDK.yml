    ■ テンプレート合成

    cdk.json と同じDIRに移動
    > cdk synth

    ■ 合成された CloudFormation テンプレート

    Resources:
      // リソース定義: SQS(Queue)
      CdkWorkshopQueue50D9D426:
        Type: AWS::SQS::Queue
        Properties:
          VisibilityTimeout: 300
        UpdateReplacePolicy: Delete
        DeletionPolicy: Delete
        Metadata:
          aws:cdk:path: CdkWorkshopStack/CdkWorkshopQueue/Resource

      // リソース定義: SQS(QueuePolicy)
      CdkWorkshopQueuePolicyAF2494A5:
        Type: AWS::SQS::QueuePolicy
        Properties:
          PolicyDocument:
            Statement:
              - Action: sqs:SendMessage
                Condition:
                  ArnEquals:
                    aws:SourceArn:
                      Ref: CdkWorkshopTopicD368A42F
                Effect: Allow
                Principal:
                  Service: sns.amazonaws.com
                Resource:
                  Fn::GetAtt:
                    - CdkWorkshopQueue50D9D426
                    - Arn
            Version: "2012-10-17"
          Queues:
            - Ref: CdkWorkshopQueue50D9D426
        Metadata:
          aws:cdk:path: CdkWorkshopStack/CdkWorkshopQueue/Policy/Resource

      // リソース定義: SQS: Stack Subscription
      CdkWorkshopQueueCdkWorkshopStackCdkWorkshopTopicD7BE96438B5AD106:
        Type: AWS::SNS::Subscription
        Properties:
          Protocol: sqs
          TopicArn:
            Ref: CdkWorkshopTopicD368A42F
          Endpoint:
            Fn::GetAtt:
              - CdkWorkshopQueue50D9D426
              - Arn
        DependsOn:
          - CdkWorkshopQueuePolicyAF2494A5
        Metadata:
          aws:cdk:path: CdkWorkshopStack/CdkWorkshopQueue/CdkWorkshopStackCdkWorkshopTopicD7BE9643/Resource

      // リソース定義: SNS: Topic
      CdkWorkshopTopicD368A42F:
        Type: AWS::SNS::Topic
        Metadata:
          aws:cdk:path: CdkWorkshopStack/CdkWorkshopTopic/Resource

      // リソース定義: CDK: Metadata
      CDKMetadata:
        Type: AWS::CDK::Metadata
        Properties:
          Analytics: v2:deflate64:H4sIAAAAAAAA/1WO0QrCMAxFv8X3NjpBwe...w0ZX8B5//lbcEAAAA=
        Metadata:
          aws:cdk:path: CdkWorkshopStack/CDKMetadata/Default
        Condition: CDKMetadataAvailable

    // 条件
    Conditions:
      CDKMetadataAvailable:
        Fn::Or:
          - Fn::Or:
              - Fn::Equals:
                  - Ref: AWS::Region
                  - af-south-1
              - Fn::Equals:
                  - Ref: AWS::Region
                  - ap-east-1
              ...

    // 引数
    Parameters:
      BootstrapVersion:
        Type: AWS::SSM::Parameter::Value<String>
        Default: /cdk-bootstrap/hnb659fds/version
        Description: Version of the CDK Bootstrap resources in this environment,
                     automatically retrieved from SSM Parameter Store. [cdk:skip]

    // ルール
    Rules:
      CheckBootstrapVersion:
        Assertions:
          - Assert:
              Fn::Not:
                - Fn::Contains:
                    - - "1"
                      - "2"
                      - "3"
                      - "4"
                      - "5"
                    - Ref: BootstrapVersion
            AssertDescription: CDK bootstrap stack version 6 required. 
                                Please run 'cdk bootstrap' with a recent version of the CDK CLI.

