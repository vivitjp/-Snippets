- ENTRY:
  EXPLAIN: |
    ワークショップ(Hello): 11.CDK Watch
  BODY: |
    ■ cdk watch

    • cdk deploy や cdk deploy --hotswap を毎回呼び出すのは冗長
    • cdk watch はコードとアセットの変更を監視、変更が検出されると自動的にデプロイを実行
    • デフォルトでは、cdk watch は --hotswap フラグを使用、ホットスワップできるか自動判断
    • cdk watch --no-hotswap と呼び出すと、ホットスワップ動作が無効
    • ホットスワップ可能な変更、完全な CloudFormation デプロイを必要とする変更の両方を検出

    ■ ファイルの修正
    • 監視ファイルは cdk.json ファイルの "watch" 設定で決定
    • "watch" には "include","exclude" のファイル名/ディレクトリ名の文字列/文字列の配列がある
    • cdk.json 基準にした相対パス
    • 「*」と「**」の両方の glob が使用可能

      {
        "app": "npx ts-node --prefer-ts-exts bin/cdk-workshop.ts",
        "watch": {
          "include": ["**"],     // すべてのファイルを監視
          "exclude": [           // 除外するファイル
            "README.md",
            "cdk*.json",
            "**/*.d.ts",
            // "**/*.js",         // .js ファイルを除外から削除
            "tsconfig.json",
            "package*.json",
            "yarn.lock",
            "node_modules",
            "test"
          ]
        },
        "context": {
          // ...
        }
      }

    ■ cdk watch のタイミング

    > cdk watch

    • 最初のデプロイがトリガーされ、cdk.json 指定のファイルの監視が開始

    ■ 変更テスト

    • lambda/hello.js の lambda アセットコード変更

    exports.handler = async function (event) {
      console.log('request:', JSON.stringify(event, undefined, 2))
      return {
        statusCode: 200,
        headers: { 'Content-Type': 'text/plain' },
        body: `Good Night, CDK! You've hit ${event.path}\n`,
      }
    }

    • Lambda コードファイルへの変更保存で、cdk watch は新しいデプロイをトリガー
    • ホットスワップ認識のため、CloudFormation デプロイをバイパス、Lambda サービスに直接デプロイ

