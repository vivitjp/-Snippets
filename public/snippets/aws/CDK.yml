- ENTRY:
  EXPLAIN: |
    ワークショップ(Hello): 7.Lambda作成
  BODY: |
    ■ Lambda 関数の作成

    • ルート(bin,lib,...の隣)に /lambda 作成
    • cdk init で作成された TS CDK プロジェクトは、デフォルトですべての .js ファイルを無視
      • .gitignore ファイルに !lambda/*.js 追加
      • パイプラインセクションで Lambda アセット検出
    • /lambda に hello.js 追加
      • API Gateway がユーザーへの HTTP レスポンス生成に使用

      exports.handler = async function (event) {
        console.log('request:', JSON.stringify(event, undefined, 2))
        return {
          statusCode: 200,
          headers: { 'Content-Type': 'text/plain' },
          body: `Hello, CDK! You've hit ${event.path}\n`,
        }
      }

