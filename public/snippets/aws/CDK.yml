- ENTRY:
  EXPLAIN: |
    概要
  BODY: |
    • AWS CloudFormationというサービスをプログラミング言語で使えるようにしたもの
    • Lambda、VPC、S3などのリソースをPythonなどで定義、デプロイできるツールキット
    • AWS CDK アプリケーションは コードを使用したインフラストラクチャの定義
    • 実行すると定義各スタックに対し AWS CloudFormation テンプレートが生成される
      ※ CDK の用語では「synthesize=合成」

