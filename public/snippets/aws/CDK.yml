  BODY: |
    ■ コンストラクトライブラリ

    • AWS CDKには AWS Construct Libraryと呼ばれる大規模なコンストラクトライブラリが付属
    • コンストラクトライブラリは AWS サービスごとにモジュールに分割
    • AWS Lambda 関数定義には AWS Lambda コンストラクトライブラリを使用

- ENTRY:
  EXPLAIN: |
    ワークショップ(Hello): 9.スタックにAWSLambda関数追加
  BODY: |
    ■ コード修正

    • lib/cdk-workshop-stack.ts の先頭に import ステートメントを追加
    • スタックに lambda.Function 追加

      import { Stack, StackProps } from "aws-cdk-lib";
      import { Code, Function, Runtime } from "aws-cdk-lib/aws-lambda";
      import { Construct } from "constructs";

      export class CdkWorkshopStack extends Stack {
        constructor(scope: Construct, id: string, props?: StackProps) { <--- クラスコンストラクタ
          super(scope, id, props);

          const hello = new Function(this, "HelloHandler", {
            runtime: Runtime.NODEJS_22_X,         // 実行環境(Nodejs v22.x)
            code:    Code.fromAsset("lambda"),    // /lambda 指定(cdkを実行する場所からの相対パス)
            handler: "hello.handler",             // ファイル名: hello, メソッド: handler
          });
        }
      }

    ■ クラスコンストラクタ

    • クラスコンストラクタは、(scope, id, props) というシグネチャを持つ CDK アプリケーションの基本構成要素
    • scope: コンストラクトが作成されるスコープ。 ほとんどの場合単に this を渡す。
    • id:    コンストラクトの 一意なローカルID。スコープ内定義リソースの CloudFormation 論理 ID 計算に使用。
    • props: (オプション)初期化プロパティ。例： runtime、code、handler など

