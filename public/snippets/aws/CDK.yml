    ...
    {"message": "Internal server error"}

    ■ CloudWatch Logs でエラーの原因を探る
    • AWS Lambda コンソール
    • HitCounter 関数(CdkWorkshopStack-HelloHitCounter という文字列を含む)をクリック
    • モニタリング タブをクリック
    • モニタリング タブの下部にある CloudWatch ログを表示 をクリック
      • AWS CloudWatch コンソールが開く
    • 最新のロググループを選択
    • 「errorMessage」を含む最新メッセージを探す
      {
        "errorMessage": "User: arn:aws:sts::123456789012:assumed-role/CdkWorkshopStack-HelloHitCounterHitCounterHandlerS-TU5M09L1UBID/
          CdkWorkshopStack-HelloHitCounterHitCounterHandlerD-144HVUNEWRWEO is not authorized to perform: dynamodb:UpdateItem on resource: 
          arn:aws:dynamodb:us-east-1:123456789012:table/CdkWorkshopStack-HelloHitCounterHits7AAEBF80-1DZVT3W84LJKB",
        "errorType": "AccessDeniedException",
        "stackTrace": [
          "Request.extractError (/var/runtime/node_modules/aws-sdk/lib/protocol/json.js:48:27)",
          "Request.callListeners (/var/runtime/node_modules/aws-sdk/lib/sequential_executor.js:105:20)",
          ...
          ]
      }

      ※ "is not authorized!" というメッセージが含まれるのを確認
         Lambda 関数が DynamoDB テーブルに書き込めない -> アクセス許可を付与していない

- ENTRY:
  EXPLAIN: |
    ワークショップ(HitCounter): 3.修正
  BODY: |
    ■ DynamoDBアクセス許可追加
    import { AttributeType, Table } from "aws-cdk-lib/aws-dynamodb";
    import { Code, Function, IFunction, Runtime } from "aws-cdk-lib/aws-lambda";
    import { Construct } from "constructs";

    export interface HitCounterProps {
      downstream: IFunction;
    }

    export class HitCounter extends Construct {
      public readonly handler: Function;

      constructor(scope: Construct, id: string, props: HitCounterProps) {
        super(scope, id);

        const table = new Table(this, "Hits", {
          partitionKey: { name: "path", type: AttributeType.STRING },
        });

        this.handler = new Function(this, "HitCounterHandler", {
          runtime: Runtime.NODEJS_22_X,
          handler: "hitcounter.handler",
          code: Code.fromAsset("lambda"),
          environment: {
            DOWNSTREAM_FUNCTION_NAME: props.downstream.functionName,
            HITS_TABLE_NAME: table.tableName,
          },
        });

        // 🔵Lambdaロールにテーブルへの読み取り/書き込み権限を付与
        table.grantReadWriteData(this.handler);

        // 🔵Lambdaロールに下流関数(downstream)への呼び出し権限を付与
        props.downstream.grantInvoke(this.handler);
      }
    }

