    ワークショップ(HitCounter): 1.コンストラクトの作成
  BODY: |
    ■ HitCounter という新しいコンストラクト定義

    • API Gateway バックエンドとして使用される Lambda 関数にアタッチ
    • 各 URL パスに対して発行されたリクエスト数をカウント
    • 結果を DynamoDB テーブルに保存

    ■ hitcounter.ts (まずは箱のみ作成)
    import { IFunction } from "aws-cdk-lib/aws-lambda";
    import { Construct } from "constructs";

    export interface HitCounterProps {
      // URLヒット数をカウントする関数
      downstream: IFunction;
    }

    export class HitCounter extends Construct {
      constructor(scope: Construct, id: string, props: HitCounterProps) {
        super(scope, id);
        // TODO (ここに DynamoDB テーブルと Lambda 関数を定義)
      }
    }

    ■ lambda/hitcounter.js
    const { DynamoDB } = require("@aws-sdk/client-dynamodb");
    const { Lambda, InvokeCommand } = require("@aws-sdk/client-lambda");

    exports.handler = async function (event) {
      console.log("request:", JSON.stringify(event, undefined, 2));

      const dynamo = new DynamoDB();
      const lambda = new Lambda();

      // hits++で「path」のDynamoDBエントリを更新
      await dynamo.updateItem({
        TableName:                 process.env.HITS_TABLE_NAME, // DynamoDB テーブル名
        Key:                       { path: { S: event.path } },
        UpdateExpression:          "ADD hits :incr",
        ExpressionAttributeValues: { ":incr": { N: "1" } },
      });

      // 下流関数を呼び出して応答をキャプチャする
      const command = new InvokeCommand({
        FunctionName: process.env.DOWNSTREAM_FUNCTION_NAME,  // ダウンストリームの Lambda 関名
        Payload: JSON.stringify(event),
      });
      const { Payload } = await lambda.send(command);
      const result = Buffer.from(Payload).toString();
      console.log("downstream response:", JSON.stringify(result, undefined, 2));
      return JSON.parse(result);        // 戻り値をupstreamに返す
    };

    ■ hitcounter.ts(箱の中身実装)

    • path をパーティションキーとする DynamoDB テーブルを定義
    • lambda/hitcounter.handler コードにバインドされた Lambda 関数を定義
    • Lambda の環境変数をリソースの functionName と tableName に紐付け

    • functionName と tableName プロパティは、スタックをデプロイしたときにのみ解決される値
      • 注意: テーブルや関数を定義時、これらの物理名を設定していない
        • 論理 ID のみ設定
      • 合成中にこれらの値を出力すると、CDK がこれらの遅延バインド値を表すための TOKEN が得られる
        • これらのトークンは 未知の文字列 として扱う必要がある
        • 連結は可能ですが、コード内で解析しようとしてはいけない

    import { AttributeType, Table } from "aws-cdk-lib/aws-dynamodb";
    import { Code, Function, IFunction, Runtime } from "aws-cdk-lib/aws-lambda";
    import { Construct } from "constructs";

    export interface HitCounterProps {
      // URLヒット数をカウントする関数
      downstream: IFunction;
    }

    export class HitCounter extends Construct {
      // カウンター機能へのアクセスを許可
      public readonly handler: Function;

      constructor(scope: Construct, id: string, props: HitCounterProps) {
        super(scope, id);

        const table = new Table(this, "Hits", {
          partitionKey: { name: "path", type: AttributeType.STRING },
        });

        this.handler = new Function(this, "HitCounterHandler", {
          runtime: Runtime.NODEJS_22_X,
          handler: "hitcounter.handler",
          code: Code.fromAsset("lambda"),
          environment: {
            DOWNSTREAM_FUNCTION_NAME: props.downstream.functionName,
            HITS_TABLE_NAME: table.tableName,
          },
        });
      }
    }

- ENTRY:
  EXPLAIN: |
    ワークショップ(HitCounter): 2.スタックにヒットカウンターを追加
  BODY: |
    ■ スタックにヒットカウンター追加
    import { Stack, StackProps } from "aws-cdk-lib";
    import { Code, Function, Runtime } from "aws-cdk-lib/aws-lambda";
    import { Construct } from "constructs";
    import { LambdaRestApi } from "aws-cdk-lib/aws-apigateway";
    import { HitCounter } from "./hitcounter";

    export class CdkWorkshopStack extends Stack {
      constructor(scope: Construct, id: string, props?: StackProps) {
        super(scope, id, props);

        // AWS Lambdaリソースを定義
        const hello = new Function(this, "HelloHandler", {
          runtime: Runtime.NODEJS_22_X,         // 実行環境(Nodejs v22.x)
          code:    Code.fromAsset("lambda"),    // /lambda 指定(cdkを実行する場所からの相対パス)
          handler: "hello.handler",             // ファイル名: hello, メソッド: handler
        });

        const helloWithCounter = new HitCounter(this, "HelloHitCounter", {
          downstream: hello,
        });

        // 「hello」関数を基にした API Gateway REST API リソースを定義
        const gateway = new LambdaRestApi(this, "Endpoint", {
          handler: helloWithCounter.handler,   // <--- API Gateway ハンドラを helloWithCounter.handler に変更
        });
      }
    }

      エンドポイントがヒット
      -> API Gateway がリクエストを ヒットカウンターハンドラ にルーティング
      -> ヒットカウンターハンドラがヒットを記録して hello 関数にリレー
      -> その後、レスポンスが逆順にユーザーまでリレー

    ■ デプロイ
