      └── cdk-workshop.ts             // エントリーポイント
    /lib
      └── cdk-workshop-stack.ts       // メインスタック定義(作業はほぼここ)
    /node_modules
    /test
      └── cdk-workshop.test.ts
    cdk.json                          // 実行方法を AWS CDK Toolkit に指示
