---
#-------------------------------
# pnpm
#-------------------------------

- ENTRY:
  EXPLAIN: インストール
  BODY: |
    ■ Windows PowerShell
    Invoke-WebRequest https://get.pnpm.io/install.ps1 -UseBasicParsing | Invoke-Expression

    ■ POSIX (Linux, macOS, WSL)
    curl -fsSL https://get.pnpm.io/install.sh | sh -
    wget -qO- https://get.pnpm.io/install.sh | sh -

    ■ インストール
    npm install -g pnpm
    # or
    corepack enable pnpm

    ■ バージョン確認
    pnpm -v

    ■ Volta を入れている場合
    volta install pnpm

      # error: Could not create shared environment for package 'pnpm'
      開発者モードをオンにしてからnpm install -g pnpmを実行する
      success: installed pnpm@10.8.1 with executables: pnpm, pnpx

    volta pin pnpm@latest

- ENTRY:
  EXPLAIN: 初期化と実行
  BODY: |
    ■ package.json 作成
    pnpm init                           // 初期化
    pnpm init -y                        // [-y] 全質問にYES

    ■ Packages インストール
    pnpm install                        // インストール
    pnpm install --save-dev             // 開発用依存関係のインストール
    pnpm install --save                 // 本番用依存関係のインストール
    pnpm install --save-exact           // バージョンを固定してインストール
    pnpm install --save-optional        // オプションの依存関係のインストール
    pnpm install --save-peer            // ピア依存関係のインストール
    pnpm install --save-optional        // オプションの依存関係のインストール

    ■ 実行
    pnpm run dev                        // 開発サーバー起動
    pnpm run build                      // ビルド

- ENTRY:
  EXPLAIN: コマンド(npm との相違点)
  BODY: |
    ■ npm との相違点
    操作                    npm                         pnpm
    ─────────────────────────────────────────────────────────
    インストール            npm install                 pnpm install
    パッケージ追加          npm install <pkg>           pnpm add <pkg>
    開発用追加              npm install -D <pkg>        pnpm add -D <pkg>
    グローバル追加          npm install -g <pkg>        pnpm add -g <pkg>
    パッケージ削除          npm uninstall <pkg>         pnpm remove <pkg>
    スクリプト実行          npm run <script>            pnpm run <script> / pnpm <script>
    パッケージ実行          npx <pkg>                   pnpm dlx <pkg>
    パッケージ一覧          npm list                    pnpm list
    更新チェック            npm outdated                pnpm outdated
    パッケージ更新          npm update                  pnpm update
    キャッシュ削除          npm cache clean --force     pnpm store prune
    ロックファイル          package-lock.json           pnpm-lock.yaml

    ■ pnpm 固有コマンド

    pnpm store path                     // グローバルストアのパス確認
    pnpm store status                   // ストアの状態確認
    pnpm store prune                    // 未使用パッケージをストアから削除
    pnpm why <pkg>                      // パッケージが依存される理由を表示
    pnpm patch <pkg>                    // パッケージにパッチを当てる
    pnpm import                         // package-lock.json → pnpm-lock.yaml に変換

    ■ ワークスペース (monorepo)

    pnpm -r run build                   // 全パッケージで build を実行 (-r = --recursive)
    pnpm -r --filter <pkg> add <dep>    // 特定パッケージに依存追加
    pnpm -r update                      // 全パッケージを更新

- ENTRY:
  EXPLAIN: コマンド(filter)
  BODY: |
    ■ --filter の用途

    monorepo 内の特定パッケージにのみコマンドを適用する場合に使用する。
    packages/ 以下に複数パッケージがある構成で、対象を絞って操作したい場合に便利。

    ■ パッケージ

    turbo repo などの monorepo ツールを使っている場合
    pnpm の --filter を併用することで、より柔軟に特定パッケージに対してコマンドを実行

    ■ 基本構文

    pnpm --filter <selector> <command>

    ■ セレクターの種類
    --filter <name>           // package.json の name でフィルタ
    --filter "./<path>"       // ディレクトリパスでフィルタ
    --filter "<name>..."      // 対象パッケージ + その依存先も含める
    --filter "...<name>"      // 対象パッケージ + それに依存する上位も含める
    --filter "[origin/main]"  // main との差分があるパッケージのみ

    ■ サンプルコマンド
    // 特定パッケージのみビルド
    pnpm --filter @myapp/ui run build

    // 特定パッケージに依存パッケージを追加
    pnpm --filter @myapp/api add axios

    // 開発依存を特定パッケージに追加
    pnpm --filter @myapp/web add -D vite

    // ディレクトリ指定でスクリプト実行
    pnpm --filter "./packages/core" run test

    // ui パッケージとそれが依存するパッケージ全てにビルド実行
    pnpm --filter "@myapp/ui..." run build

    // api パッケージに依存する全パッケージでテスト実行
    pnpm --filter "...@myapp/api" run test

    // main ブランチからの差分があるパッケージのみテスト
    pnpm --filter "[origin/main]" run test

    // 複数フィルタを同時指定
    pnpm --filter @myapp/ui --filter @myapp/api run lint

