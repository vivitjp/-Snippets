    ReactDOM.createRoot(document.getElementById('root')!).render(<App />);

- ENTRY:
  EXPLAIN: Form使用例
  BODY: |
    ■ CreatePostForm.tsx
    import React, { useState } from 'react';
    import { useMutation, gql } from '@apollo/client';

    // ミューテーション定義 (GraphQLスキーマに依存)
    const CREATE_POST = gql`
      mutation CreateNewPost($title: String!, $body: String!, $userId: Int!) {
        createPost(title: $title, body: $body, userId: $userId) {
          id
          title
          # ここでサーバーから返ってくるデータを指定
        }
      }
    `;

    const CreatePostForm: React.FC = () => {
      const [title, setTitle] = useState('');
      const [body, setBody] = useState('');
      const [userId, setUserId] = useState(1); // デフォルトでユーザーID 1 を使用

      // useMutation フックの使用
      // [ミューテーション関数, 結果オブジェクト] の配列を返す
      const [createPost, { loading, error, data }] = useMutation(
        CREATE_POST,
        // ミューテーション成功後、GET_POSTS クエリを自動的に再実行する
        refetchQueries: [
          { query: GET_POSTS } // クエリの名前またはドキュメントを指定
        ],
      );

      const handleSubmit = async (e: React.FormEvent) => {
        e.preventDefault();

        try {
          // ミューテーション関数を実行し、variables（変数）を渡す
          const response = await createPost({
            variables: {
              title,
              body,
              userId,
            },
          });

          console.log("投稿が成功しました:", response.data.createPost);
          setTitle('');
          setBody('');

        } catch (err) {
          // エラーは useMutation の error ステートでも捕捉される
          console.error("ミューテーションの実行中にエラーが発生しました:", err);
        }
      };

      return (
        <form onSubmit={handleSubmit}>
          <h2>新しい投稿を作成</h2>

          {/* ロード中、エラー、成功時の表示 */}
          {loading && <p>送信中です...</p>}
          {error && <p style={{ color: 'red' }}>エラーが発生しました: {error.message}</p>}
          {data && <p style={{ color: 'green' }}>投稿ID {data.createPost.id} が正常に作成されました！</p>}

          <div>
            <label>タイトル:</label>
            <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} required />
          </div>
          <div>
            <label>本文:</label>
            <textarea value={body} onChange={(e) => setBody(e.target.value)} required />
          </div>
          
          <button type="submit" disabled={loading}>
            投稿する
          </button>
        </form>
      );
    };

    export default CreatePostForm;

- ENTRY:
  EXPLAIN: キャッシュオプション
  BODY: |
    const CREATE_POST = gql`...`;
    const GET_POSTS = gql`...`;

    const CreatePostForm = () => {
      const [createPost] = useMutation(CREATE_POST, {
        // キャッシュを直接操作する
        update(cache, { data }) {
          const newPost = data?.createPost;

          // GET_POSTS クエリの結果をキャッシュから読み取る
          const existingPosts: any = cache.readQuery({ query: GET_POSTS });

          // 新しい投稿を既存のリストの先頭に追加して、キャッシュに書き戻す
          if (existingPosts && newPost) {
            cache.writeQuery({
              query: GET_POSTS,
              data: {
                posts: [newPost, ...existingPosts.posts],
              },
            });
          }
        }
      });

      // ... handleSubmit ロジック ...
    };

- ENTRY:
  EXPLAIN: useQueryの使用例
  BODY: |
    import React from 'react';
    import { useQuery, gql } from '@apollo/client';

    // ----------------------------------------------------
    // 1. クエリ定義 (GraphQLスキーマに依存)
    // ----------------------------------------------------
    const GET_POSTS = gql`
      query GetPosts {
        posts {
          id
          title
          userId
        }
      }
    `;

    // サーバーからのレスポンスデータの型定義
    interface Post {
      id: string;
      title: string;
      userId: number;
    }

    // クエリ結果全体の型定義
    interface QueryData {
      posts: Post[];
    }


    // ----------------------------------------------------
    // 2. コンポーネントでの useQuery の使用
    // ----------------------------------------------------
    const PostList: React.FC = () => {
      // 自動的にサーバーへリクエストが飛び、ステータスが更新される
      const { loading, error, data, refetch } = useQuery<QueryData>(
        GET_POSTS
        // 5秒 (5000ミリ秒) ごとに自動でクエリを再実行する
        pollInterval: 5000, 
      
      );

      // --- 状態に応じた描画 ---

      if (loading) {
        // データ取得中の表示
        return <p>投稿を読み込み中...</p>;
      }

      if (error) {
        // エラー発生時の表示
        return <p style={{ color: 'red' }}>エラーが発生しました: {error.message}</p>;
      }

      // 更新ボタンを押したときのハンドラ
      const handleRefreshClick = () => {
        refetch(); // データを再取得する
      };
      
      // データが正常に取得できた場合の表示
      return (
        <div>
          <h2>投稿リスト</h2>
          <ul>
            {/* data.posts が存在し、リストであることを確認してマップ処理 */}
            {data?.posts.map((post) => (
              <li key={post.id}>
                <strong>{post.title}</strong> (ユーザーID: {post.userId})
              </li>
            ))}
          </ul>
        <div>
          <button onClick={handleRefreshClick}>最新の情報に更新</button>
        </div>          
        </div>
      );
    };

    export default PostList;

#-------------------------------
# codegen
#-------------------------------
- ENTRY:
  CATEGORY: GraphQL Code Generator

- ENTRY:
  EXPLAIN: 解説
  BODY: |
    ■ GraphQL Code Generator（graphql-codegen）

    ・スキーマとドキュメント（クエリ/ミューテーション/フラグメント）から型定義や型付きコード自動生成
    ・TypeScript, Apollo/Urql/React, Query/graphl-request など向けの豊富なプラグイン

    ■ 主な利点

    ・型安全: クエリの変数とレスポンスの型を自動生成して、型エラーを早期に検出できます
    ・生産性: 手動での型定義が不要になりリファクタが楽になります
    ・多様な出力: types / operations / hooks / SDK など用途に応じた出力が可能

- ENTRY:
  EXPLAIN: フロントエンド 導入（最小構成）
  BODY: |
    ■ パッケージインストール

       npm i -D
       @graphql-codegen/cli
       @graphql-codegen/typescript
       @graphql-codegen/typescript-operations
       @graphql-codegen/typescript-react-apollo

    ■ `codegen.yml` 例

      schema: https://api.example.com/graphql
      documents: src/**/*.graphql
      generates:
        src/__generated__/graphql.tsx:
          plugins:
            - typescript
            - typescript-operations
            - typescript-react-apollo
          config:
            withHooks: true
            withHOC: false
            withComponent: false
            scalars:
              DateTime: string

- ENTRY:
  EXPLAIN: フロントエンド generate 実行
  BODY: |
    ■ スクリプト追加/実行:

    ・package.json に追加

      "generate": "graphql-codegen --config codegen.yml"

    ・`yarn generate` 実行

    ■ よく使うプラグイン

    ・`@graphql-codegen/typescript`             : スキーマから TypeScript 型生成
    ・`@graphql-codegen/typescript-operations`  : queries/mutationsから variables/result 型生成
    ・`@graphql-codegen/typescript-react-apollo`: Apollo 用の型付き hooks 生成

- ENTRY:
  EXPLAIN: 導入から運用までの流れ
  BODY: |
    ■ バックエンド準備

    ・スキーマ確定（SDL または実行中サーバー）
    ・スキーマ公開（schema.graphql ファイル or introspection エンドポイント）

    ■ フロントエンド準備

    ・ドキュメント準備（.graphql ファイル / gql テンプレート）
    ・codegen.yml 作成（schema, documents, generates, plugins）

    ■ 実行（開発）

    ・スキーマ最新化（バックエンド）
    ・yarn graphql-codegen 実行（ローカル）
    ・生成物出力（types, operations, hooks）
    ・IDEで確認、開発継続

    ■ 実行（CI/リリース）

    ・バックエンド CI でスキーマ検証・公開
    ・フロントCIで yarn generate 実行（ビルド前）
    ・型チェック合格後ビルド・デプロイ

    ■ 注意点（短）

    ・カスタムスカラーは scalars マッピング必須
    ・.tsx 内の gql を拾うなら documents の glob を拡張
    ・スキーマ変更はフロント同期リリースを検討

- ENTRY:
  EXPLAIN: 設定と注意点
  BODY: |
    ■ よくある設定と注意点

    ・`documents` に `.tsx` 内の `gql` を含める場合は glob を `"src/**/*.{graphql,ts,tsx}"` のように拡張
    ・カスタムスカラーは `scalars` で必ずマッピングする（例: DateTime: string）
    ・認証付きスキーマを取得する場合は `schema` の下に `headers` を設定し、CIでは環境変数を使う
    ・生成ファイルをコミットするかどうかは方針次第。
      CI でのみ生成する運用も可能だが、IDE の型補完のためにリポジトリに含めるケースが多い

    ■ 運用フロー

    ・開発: `graphql-codegen --watch` で変更を監視し自動生成
    ・CI: ビルド前に `yarn generate` を実行して型整合性を保証

    ■ 実務ヒント

    ・生成先を `src/__generated__` に分けると IDE とビルドが使いやすくなる
    ・`namingConvention` や `avoidOptionals` の設定で出力型の形を調整する
    ・大規模プロジェクトでは `generates` を分割して API ごとに出力先を分離すると高速化に寄与します
