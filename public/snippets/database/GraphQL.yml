# Apollo Server
#-------------------------------
- ENTRY:
  CATEGORY: サーバ（Apollo & Axios）

- ENTRY:
  EXPLAIN: パッケージ
  BODY: |
    ■ 必要なパッケージのインストール (Node.js + Express + Apollo Server)
    npm install express @apollo/server graphql
    npm install -D typescript @types/node ts-node @apollo/server @types/express

- ENTRY:
  EXPLAIN: プロジェクト構成例
  BODY: |
    ■ プロジェクト構成例
    graphql-server-example/
    ├── src/
    │   ├── index.ts        # サーバー起動とExpressの設定
    │   ├── schema.ts       # GraphQLスキーマ定義 (typeDefs)
    │   ├── resolvers.ts    # データ処理ロジック (resolvers) <--- ここを修正
    │   └── apiService.ts   # 外部API呼び出しのヘルパー関数
    ├── package.json
    ├── tsconfig.json

- ENTRY:
  EXPLAIN: APIコール(axios)
  BODY: |
    ■ src/apiService.ts

    import axios, { AxiosError } from 'axios';

    ■ 型定義
    export interface ExternalPost {
        userId: number;
        id: number;
        title: string;
        body: string;
    }

    export interface CreatePostArgs {
        title: string;
        body: string;
        userId: number;
    }

    const API_URL = 'https://jsonplaceholder.typicode.com';

    ■ fetch all
    export const fetchPosts = async (): Promise<ExternalPost[]> => {
        try {
            const response = await axios.get<ExternalPost[]>(`${API_URL}/posts`);
            return response.data;
        } catch (error) {
            if (axios.isAxiosError(error)) {
                console.error(`API Error: ${error.message}`);
                throw new Error(`外部APIの呼び出しに失敗しました: ${error.message}`);
            } else {
                console.error(`Unexpected Error: ${error}`);
                throw new Error('不明なエラーが発生しました');
            }
        }
    };

    ■ fetch by ID
    export const fetchPostById = async (id: number): Promise<ExternalPost> => {
        try {
            const response = await axios.get<ExternalPost>(`${API_URL}/posts/${id}`);
            return response.data;
        } catch (error) {
            if (axios.isAxiosError(error) && error.response?.status === 404) {
                throw new Error(`投稿ID ${id} が見つかりませんでした`);
            } else if (axios.isAxiosError(error)) {
                throw new Error(`API Error: ${error.message}`);
            } else {
                throw new Error('不明なエラーが発生しました');
            }
        }
    };

    ■ create
    export const createPost = async (postData: CreatePostArgs): Promise<ExternalPost> => {
        try {
            const response = await axios.post<ExternalPost>(`${API_URL}/posts`, postData);
            return response.data;
        } catch (error) {
            if (axios.isAxiosError(error)) {
                console.error(`API Error during creation: ${error.message}`);
                throw new Error(`投稿の作成に失敗しました: ${error.message}`);
            } else {
                throw new Error('不明なエラーが発生しました');
            }
        }
    };

    ■ delete
    export const deletePost = async (id: number): Promise<{ success: boolean; id: number }> => {
        try {
            await axios.delete(`${API_URL}/posts/${id}`);
            return { success: true, id: id };
        } catch (error) {
            if (axios.isAxiosError(error) && error.response?.status === 404) {
                throw new Error(`削除対象の投稿ID ${id} が見つかりませんでした`);
            } else if (axios.isAxiosError(error)) {
                console.error(`API Error during deletion: ${error.message}`);
                throw new Error(`投稿の削除に失敗しました: ${error.message}`);
            } else {
                throw new Error('不明なエラーが発生しました');
            }
        }
    };

- ENTRY:
  EXPLAIN: スキーマ定義
  BODY: |
    ■ src/schema.ts

    export const typeDefs = `#graphql
      type Post {
        id: ID!
        title: String!
        body: String!
        userId: Int!
      }

      type Query {
        posts: [Post]
        post(id: ID!): Post
      }

      # 削除の成否を返すための型を新しく定義
      type DeleteResult {
        success: Boolean!
        id: ID!
      }

      type Mutation {
        createPost(title: String!, body: String!, userId: Int!): Post!
        deletePost(id: ID!): DeleteResult!
      }
    `;

- ENTRY:
  EXPLAIN: リゾルバ
  BODY: |
    ■ src/resolvers.ts 

    import { fetchPosts, fetchPostById, createPost, deletePost } from './apiService';
    import { GraphQLError } from 'graphql';

    export const resolvers = {
      Query: {
        ■ 全取得
        posts: async () => {
          try {
            const data = await fetchPosts();
            return data;
          } catch (error: any) {
            throw new Error(`投稿の取得中にエラーが発生しました: ${error.message}`);
          }
        },

        ■ ID指定取得
        post: async (parent: any, args: { id: string }) => {
          try {
            const data = await fetchPostById(Number(args.id));
            return data;
          } catch (error: any) {
            throw new Error(`投稿の取得中にエラーが発生しました: ${error.message}`);
          }
        },
      },

      Mutation: {
        ■ 作成
        createPost: async (parent: any, args: { title: string, body: string, userId: number }) => {
          try {
            const newPost = await createPost(args);
            return newPost;
          } catch (error: any) {
            throw new GraphQLError(`Mutation failed: ${error.message}`, {
                extensions: { code: 'API_CREATION_ERROR' },
            });
          }
        },
        
        ■ 削除
        deletePost: async (parent: any, args: { id: string }) => {
            try {
                // APIサービスを呼び出し、削除結果を返す
                const result = await deletePost(Number(args.id));
                return result;
            } catch (error: any) {
                throw new GraphQLError(`Deletion failed: ${error.message}`, {
                    extensions: { code: 'API_DELETION_ERROR' },
                });
            }
        }
      },
    };

- ENTRY:
  EXPLAIN: サーバー起動処理
  BODY: |
    ■ src/index.ts

    import { ApolloServer } from '@apollo/server';
    import { expressMiddleware } from '@apollo/server/express4';
    import { ApolloServerPluginDrainHttpServer } from '@apollo/server/plugin/drainHttpServer';
    import express from 'express';
    import http from 'http';
    import cors from 'cors';
    import bodyParser from 'body-parser';

    import { typeDefs } from './schema';
    import { resolvers } from './resolvers';

    interface MyContext {
      token?: String;
    }

    const app = express();
    const httpServer = http.createServer(app);

    const server = new ApolloServer<MyContext>({
      typeDefs,
      resolvers,
      plugins: [ApolloServerPluginDrainHttpServer({ httpServer })],
    });

    async function startServer() {
        await server.start();

        app.use(
            '/graphql',
            cors< cors.CorsRequest >(),
            bodyParser.json(),
            expressMiddleware(server, {
                context: async ({ req }) => ({ token: req.headers.token }),
            }),
        );

        await new Promise<void>((resolve) => httpServer.listen({ port: 4000 }, resolve));
        console.log(`🚀 Server ready at http://localhost:4000/graphql`);
    }

    startServer();

#-------------------------------
# Apollo Client
#-------------------------------
- ENTRY:
  CATEGORY: クライアント(Apollo)

- ENTRY:
  EXPLAIN: パッケージ
  BODY: |
    npm install @apollo/client graphql
    npm install -D typescript ts-node @types/node # ts-nodeは実行用

- ENTRY:
  EXPLAIN: client.ts (Apollo Client設定)
  BODY: |
    import { ApolloClient, InMemoryCache, gql, ApolloQueryResult } from '@apollo/client';

    const client = new ApolloClient({
      uri: 'http://localhost:4000/graphql', // <-- GraphQLサーバーURL
      cache: new InMemoryCache(),
    });

    // --- 1. クエリ定義 ---
    const GET_POSTS = gql`
      query GetPosts {
        posts {
          id
          title
          userId
        }
      }
    `;

    // --- 2. ミューテーション定義 ---
    const CREATE_POST = gql`
      mutation CreateNewPost($title: String!, $body: String!, $userId: Int!) {
        createPost(title: $title, body: $body, userId: $userId) {
          id
          title
          userId
        }
      }
    `;

    // --- 3. データ取得 ---
    async function fetchPosts() {
      console.log("--- 投稿リストを取得中 ---");
      try {
        const result: ApolloQueryResult<any> = await client.query({
          query: GET_POSTS
        });
        console.log("取得結果:", result.data.posts);
      } catch (error) {
        console.error("投稿の取得中にエラーが発生しました:", error);
      }
    }

    // --- 4. データ登録 ---
    async function createNewPost(title: string, body: string, userId: number) {
      console.log(`--- 新しい投稿を作成中: ${title} ---`);
      try {
        const result = await client.mutate({
          mutation: CREATE_POST,
          variables: { // クエリ変数としてデータを渡す
            title,
            body,
            userId
          },
        });
        console.log("作成された投稿:", result.data.createPost);
      } catch (error) {
        console.error("投稿の作成中にエラーが発生しました:", error);
      }
    }

    async function main() {
      await fetchPosts();

      await createNewPost("クライアントからの投稿", "Apollo Clientを使って投稿しました。", 1);
      
      // 新しい投稿を含めて再度リストを取得
      await fetchPosts();
    }

    main();

- ENTRY:
  EXPLAIN: useMutationの使用例(App.tsx)
  BODY: |
    ■ App.tsx や index.tsx 
    import { ApolloClient, InMemoryCache, ApolloProvider } from '@apollo/client';
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import CreatePostForm from './CreatePostForm'; 

    const client = new ApolloClient({
      uri: 'http://localhost:4000/graphql', 
