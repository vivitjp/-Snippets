#-------------------------------
# GraphQL
#-------------------------------
- ENTRY:
  CATEGORY: Kick Start

- ENTRY:
  EXPLAIN: スキーマ定義
  BODY: |
    ■ スキーマ定義 (Schema Definition)

    # User型
    type User {
      id: ID!
      username: String!
      email: String
      posts: [Post!]!                   # そのユーザーが投稿した記事のリスト
    }

    # Post型
    type Post {
      id: ID!
      title: String!
      content: String!
      author: User! # この記事を書いたユーザー
    }

    # クエリ定義
    type Query {
      user(id: ID!): User               # IDでユーザーを取得するクエリ
      allUsers: [User!]!                # 全ユーザーのリストを取得するクエリ
    }

    # ミューテーション定義
    type Mutation {
      createPost(title: String!, content: String!, authorId: ID!): Post!
    }

- ENTRY:
  EXPLAIN: クエリ
  BODY: |
    ■ サンプル
    query GetAllUserNames {
      allUsers {
        id
        username
        # emailフィールドは不要なので取得しない
      }
    }

    レスポンス
    {
      "data": {
        "allUsers": [
          {
            "id": "1",
            "username": "alice"
          },
          {
            "id": "2",
            "username": "bob"
          }
        ]
      }
    }

    ■ サンプル(引数付き)
    query GetUserWithPosts($userId: ID!) {
      user(id: $userId) {
        username
        email
        posts {
          title
        }
      }
    }

    ●クエリ変数
    {
      "userId": "1"
    }

    ●レスポンス
    {
      "data": {
        "user": {
          "username": "alice",
          "email": "alice@example.com",
          "posts": [
            {
              "title": "GraphQL入門"
            },
            {
              "title": "Pythonの新しい機能"
            }
          ]
        }
      }

- ENTRY:
  EXPLAIN: ミューテーション
  BODY: |
    ■ サンプル
    mutation CreateNewPost($title: String!, $content: String!, $authorId: ID!) {
      createPost(title: $title, content: $content, authorId: $authorId) {
        # 作成成功後、サーバーから返してほしい情報を指定
        id
        title
        author {
          username
        }
      }
    }

    ●クエリ変数
    {
      "title": "VSCodeの設定",
      "content": "便利なVSCodeの設定を紹介します。",
      "authorId": "2"
    }

    ●レスポンス
    {
      "data": {
        "createPost": {
          "id": "3",
          "title": "VSCodeの設定",
          "author": {
            "username": "bob"
          }
        }
      }
    }

- ENTRY:
  EXPLAIN: |
    キーワード
  TABLE:
    OPTION:
      ALIGN:
        - left
        - left
        - left
      HAS_TITLE: false
      WIDTH:
        - 15%
        - 15%
    BODY: |
      スキーマ	Schema	APIを通じてアクセスできるデータの形や、可能な操作（クエリ・ミューテーション）の全体像を定義するもの。
      クエリ	Query	クライアントがサーバーからデータを取得するために使用する操作。どのフィールドが必要かをクライアントが指定できる。
      ミューテーション	Mutation	クライアントがサーバー上のデータを変更（作成・更新・削除）するために使用する操作。
      リゾルバ	Resolver	スキーマで定義された特定のフィールドや操作（クエリ・ミューテーション）が要求された際に、実際にデータをデータベースなどから取得・処理するサーバー側のロジック（関数）。
      フィールド	Field	スキーマ内の型が持つ具体的なデータ属性。クライアントはクエリで取得したいフィールドを選択する。
      スカラー型	Scalar Types	それ以上分解できない、基本的なデータ型（例: String, Int, Boolean, Float, ID）。
      非ヌル	Non-Null / !	フィールドの定義で型の末尾に ! を付けることで、その値が null にならないことを保証する制約。
      リスト	List / []	フィールドが単一の値ではなく、その型の値の配列であることを示す（例: [Post], [String!]!）。
      クエリ変数	Variables	クエリやミューテーションの実行時に、動的な値を外部から安全に注入するための仕組み（例: 検索IDや入力フォームの値）。
      フラグメント	Fragment	複数のクエリや場所で共通して使用するフィールドの集合を定義し、再利用可能にする機能。
      ディレクティブ	Directives	クエリやスキーマ定義に付加的な指示やメタデータを与えるための構文（例: @include(if: ...) や @deprecated）。
      イントロスペクション	Introspection	スキーマ自体をクエリする（問い合わせる）機能。開発ツールがAPIの構造を動的に解析するのに利用する。
      サブスクリプション	Subscription	サーバーからクライアントへリアルタイムでデータ更新をプッシュするための操作（通常WebSocketを使用）。
      ルートフィールド	Root Field / Root Operation	スキーマの開始点となる特別な型（通常は Query, Mutation, Subscription の3つ）。
      タイプデフ	TypeDefs	スキーマ定義言語 (SDL) を使って記述された、具体的な型定義の文字列やファイル。

