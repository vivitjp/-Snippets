#-------------------------------
# Methods
#-------------------------------
- ENTRY:
  CATEGORY: メソッド

- ENTRY:
  EXPLAIN: Reset()
  BODY: |
    ■ 主用途

    ・reset() 
      全項目を初期値に戻す
      フォーム送信後に入力値初期化

    ・reset(values) 
      任意の値に一括更新
      APIから取得したデータでフォーム値を一括更新
      編集・新規・キャンセル・API反映など多用途
      編集画面で「キャンセル」ボタンを押した時、元の値に戻す
      エラー発生時やリセットボタンで全項目をクリア

    ■ 例

    import { useForm } from "react-hook-form"

    function MyForm({ defaultValues }) {
      const { register, handleSubmit, reset } = useForm({ defaultValues })

      const onSubmit = data => {
        // API送信...
        reset()                         // 全項目を初期値に戻す
      }

      // 外部データでフォーム値を更新
      useEffect(() => {
        reset(defaultValues)            // 新しい値でフォームを再初期化
      }, [defaultValues])

      return (
        <form onSubmit={handleSubmit(onSubmit)}>
          <input {...register("name")} />
          <button type="submit">送信</button>
          <button type="button" onClick={() => reset()}>リセット</button>
        </form>
      )
    }

    ■ reset(values, options) の options 詳細

      reset(values, {
        keepErrors,                     // エラー状態保持（false:クリア）APIエラーやバリデーションエラーをリセット後も残す
        keepDirty,                      // dirty状態保持（false:初期化）編集済み（dirty）状態をリセット後も維持
        keepValues,                     // 現在の値保持（false:valuesで上書）現在のフォーム値を維持（resetで値を変えたくない時）
        keepTouched,                    // touched状態を保持（false:初期化）touched（フォーカス済み）状態維持
        keepIsSubmitted,                // isSubmitted状態を保持、送信済み状態を維持
        keepSubmitCount,                // submitCountを保持、送信回数を維持
        keepDefaultValues,              // defaultValuesを保持（false:新しい値で上書き）defaultValuesを変更せず維持
        keepIsValid,                    // isValid状態を保持、バリデーション結果を維持
        keepDirtyValues,                // dirtyな値のみ保持（他は初期化）dirtyな値のみ維持し、他は初期化
      })

    ■ 例

    // 送信後、dirty状態とエラーだけ維持
    reset(newValues, { keepDirty: true, keepErrors: true })

    // touched状態も維持
    reset(newValues, { keepTouched: true })

    // すべて初期化（デフォルト）
    reset()

    ■ reset 時に「defaultValues ではなく、現在の input 値を維持したい」

    1. reset(undefined, { keepValues: true })

      これは「現在のフォーム値（input値）をそのまま維持」します。
      defaultValues も更新されません。

    2. reset(values, { keepValues: true })

      values を渡しても、keepValues: true の場合は「現在の値」が優先されます。
      values で上書きしたい場合は keepValues: false を使うべきです。

      ※全体的に「今の値を維持」するが、個別に「値が未入力（undefined）」の場合のみ、values の値をセット

      name: "abc"（input値あり） → reset({ name: "def" }, { keepValues: true }) → "abc" のまま
      age: undefined（input値なし） → reset({ age: 20 }, { keepValues: true }) → "20" になる

