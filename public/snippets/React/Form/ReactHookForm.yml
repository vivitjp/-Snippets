- ENTRY:
  CATEGORY: API

- ENTRY:
  EXPLAIN: useForm & method
  BODY: |
    const method = useForm({
      mode,                             // バリデーション発火タイミング: "onChange" | "onBlur" | "onSubmit" | "onTouched" | "all"
      reValidateMode,                   // 再バリデーション発火タイミング: "onChange" | "onBlur" | "onSubmit"

      defaultValues,                    // 初期値オブジェクト（フォームの初期値）

      values,                           // 外部からフォーム値をリアクティブに更新したい場合
      errors,                           // 外部からエラー状態をリアクティブに更新したい場合
      resetOptions,                     // reset時の挙動制御（例: keepErrors, keepDirty, keepValues など）
      criteriaMode,                     // "all"で全てのバリデーションエラーを表示、"firstError"で最初のみ

      shouldFocusError,                 // エラー時に自動で該当フィールドへフォーカスするか
      delayError,                       // エラー表示を遅延させる（ms指定）

      shouldUseNativeValidation,        // ブラウザのネイティブバリデーションAPIを使うか
      shouldUnregister,                 // アンマウント時にフィールド登録解除するか
    });

    method: {
      register,                         // フィールド登録（input, select等に紐付け）
      unregister,                       // フィールド登録解除（不要になったinput等）

      handleSubmit,                     // 送信イベントラッパー（バリデーション→onSubmit実行）
      reset,                            // フォーム値・状態のリセット（初期値や任意値に戻す）
      watch,                            // フィールド値の監視（値の変化を取得）

      control,                          // Controller用の制御オブジェクト（複雑なUIや外部コンポーネント用）

      setValue,                         // フィールド値の手動設定（個別に値を変更）
      getValues,                        // 全フィールド値の取得（オブジェクトで返す）

      formState, 🔵                     // フォーム全体の状態（エラー, dirty, touched, isValid等）
      getFieldState,                    // 個別フィールドの状態取得（isDirty, isTouched, error等）

      trigger,                          // バリデーションの手動実行（任意タイミングで検証）
      setFocus,                         // 指定フィールドへフォーカス（エラー時やUX向上）

      clearErrors,                      // エラー状態のクリア（全体または個別）
      setError,                         // エラー状態の手動設定（APIエラー等を反映）
      resetField,                       // 個別フィールドのみリセット（初期値や空に戻す）
    }

